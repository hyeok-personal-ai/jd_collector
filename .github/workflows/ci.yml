name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      RADAR_WORKER: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check public file boundaries
        run: python scripts/check_publication.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run regression tests
        run: python -X utf8 -m pytest -q
      - name: Replay synthetic public feeds
        run: python -X utf8 -m app.offline_replay
