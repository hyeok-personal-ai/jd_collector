[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruit-radar"
version = "2.8.0"
description = "Modular recruitment announcement crawler and search API"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy>=1.26,<3"]
postgres = ["psycopg[binary]>=3.1,<4"]
playwright = ["playwright>=1.40"]
analysis = ["fastembed>=0.9,<1"]
documents = ["pypdf>=5,<7", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["assets/*.json", "static/*.html"]
